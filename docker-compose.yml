services:
  dadkit:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${DADKIT_IMAGE:-dadkit:latest}"
    ports:
      - "${DADKIT_PORT:-3333}:${DADKIT_PORT:-3333}"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "${DADKIT_PORT:-3333}"
      NODE_ENV: production
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const http=require('http');const port=process.env.PORT||3333;http.get({host:'127.0.0.1',port,path:'/'},res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
