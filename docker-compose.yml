services:
  dadkit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DADKIT_BUILD_TIME: "${DADKIT_BUILD_TIME:-unknown}"
    image: "${DADKIT_IMAGE:-dadkit:latest}"
    init: true
    ports:
      - "${DADKIT_BIND_ADDRESS:-127.0.0.1}:${DADKIT_PORT:-3333}:3333"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3333"
      NODE_ENV: production
      DADKIT_BUILD_TIME: "${DADKIT_BUILD_TIME:-unknown}"
      DADKIT_PUBLIC_ORIGIN: "${DADKIT_PUBLIC_ORIGIN:-}"
      DADKIT_WEBDAV_PROXY_ALLOWED_HOSTS: "${DADKIT_WEBDAV_PROXY_ALLOWED_HOSTS:-}"
      DADKIT_DATA_DIR: "${DADKIT_DATA_DIR:-/app/data}"
      DADKIT_SYNC_REGISTRATION_MODE: "${DADKIT_SYNC_REGISTRATION_MODE:-open}"
      DADKIT_SYNC_LEGACY_CREATE_ENABLED: "${DADKIT_SYNC_LEGACY_CREATE_ENABLED:-true}"
      DADKIT_SYNC_MAX_SPACE_BYTES: "${DADKIT_SYNC_MAX_SPACE_BYTES:-25165824}"
      DADKIT_SYNC_MAX_DEVICES: "${DADKIT_SYNC_MAX_DEVICES:-12}"
      DADKIT_SYNC_MAX_ACTIVE_INVITES: "${DADKIT_SYNC_MAX_ACTIVE_INVITES:-5}"
      DADKIT_SYNC_DEFAULT_INVITE_TTL_MINUTES: "${DADKIT_SYNC_DEFAULT_INVITE_TTL_MINUTES:-30}"
      DADKIT_SYNC_MAX_INVITE_TTL_MINUTES: "${DADKIT_SYNC_MAX_INVITE_TTL_MINUTES:-1440}"
      DADKIT_TRUST_PROXY_HOPS: "${DADKIT_TRUST_PROXY_HOPS:-0}"
      DADKIT_SYNC_REQUIRE_HTTPS: "${DADKIT_SYNC_REQUIRE_HTTPS:-true}"
    volumes:
      - "dadkit-data:${DADKIT_DATA_DIR:-/app/data}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const http=require('http');http.get({host:'127.0.0.1',port:3333,path:'/healthz'},res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  dadkit-data:
