plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "dadkit"
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyPassword
android {
    compileSdkVersion 36
    namespace "com.dadkit.mobile"

    defaultConfig {
        applicationId "com.dadkit.mobile"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 17
        versionName "3.4.4"
    }

    androidResources {
        ignoreAssetsPattern = "default_checklist.json"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError true
        // Keep the verified FileProvider dependency pinned for this release.
        disable 'GradleDependency'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.13.1'
}
