plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "dadkit"
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyPassword
// The deployment origin is supplied by the build environment, never committed.
def configuredOrigin = System.getenv("DADKIT_PUBLIC_ORIGIN")
def apiOrigin = configuredOrigin ?: "https://dadkit.example.com"
def apiUri = new URI(apiOrigin)
if (apiUri.scheme != "https" || !apiUri.host || apiUri.rawUserInfo ||
        apiUri.rawQuery || apiUri.rawFragment || !(apiUri.path in ["", "/"]) || apiUri.port != -1) {
    throw new GradleException("DADKIT_PUBLIC_ORIGIN must be an HTTPS origin without credentials, path or port")
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } && !configuredOrigin) {
    throw new GradleException("DADKIT_PUBLIC_ORIGIN is required for release builds")
}
android {
    compileSdkVersion 36
    namespace "com.dadkit.mobile"

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.dadkit.mobile"
        buildConfigField "String", "API_HOST", groovy.json.JsonOutput.toJson(apiUri.host)
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 28
        versionName "1.0.0"
    }

    androidResources {
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError true
        // Keep the verified FileProvider dependency pinned for this release.
        disable 'GradleDependency'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.13.1'
    // WebViewAssetLoader：以 https 伪域提供 APK 内置的静态资源。
    implementation 'androidx.webkit:webkit:1.14.0'
}
