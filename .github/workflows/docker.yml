name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify lint, tests, production build and performance budgets
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run performance:check

      - name: Install Playwright browsers
        timeout-minutes: 26
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s 12m npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out."
            sleep 5
          done
          exit 1

      - name: Run Chromium and WebKit acceptance tests
        run: npm run test:e2e

      - name: Run Docker integration tests
        run: npm run test:docker

      - name: Compute build time
        run: echo "DADKIT_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/yepixpert/dadkit:latest
            ghcr.io/yepixpert/dadkit:sha-${{ github.sha }}
          build-args: |
            DADKIT_BUILD_TIME=${{ env.DADKIT_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
