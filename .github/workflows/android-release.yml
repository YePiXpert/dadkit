name: android-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/dadkit-release.keystore
      ANDROID_KEY_ALIAS: dadkit
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DADKIT_PUBLIC_ORIGIN: https://dadkit.505f.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag, main ancestry and absent Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.4.13"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and verify web application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run performance:check
          npm run android:validate -- "$GITHUB_REF_NAME"

      - name: Install Playwright browsers
        timeout-minutes: 26
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s 12m npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out."
            sleep 5
          done
          exit 1

      - name: Run Chromium and WebKit acceptance tests
        run: npm run test:e2e

      - name: Run Docker integration tests
        run: npm run test:docker

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install fixed Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify remote-shell APK alignment and signature
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          zipinfo -1 "$APK" > apk-entries.txt
          if grep -q '^assets/www/' apk-entries.txt; then
            echo "Remote-shell APK must not contain bundled web pages." >&2
            exit 1
          fi
          if grep -q '^assets/default_checklist.json$' apk-entries.txt; then
            echo "Retired native checklist asset must not be packaged." >&2
            exit 1
          fi
          cp "$APK" DadKit-3.4.13.apk
          sha256sum DadKit-3.4.13.apk > DadKit-3.4.13.apk.sha256
          cp "$AAB" DadKit-3.4.13.aab

      - name: Store AAB privately for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: DadKit-3.4.13-aab
          path: DadKit-3.4.13.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          DadKit 3.4.13

          - 下线语义不清且使用成本较高的家庭分工与采购规划功能
          - 首页原家庭分工入口替换为备份与恢复，工具页补齐清单设置和家庭成员入口
          - 物品详情移除负责人、预算、购买渠道和截止日期等规划编辑项
          - 可移植数据格式升级到 v10，不再保存、导出或同步家庭分工字段
          - 旧 v7-v9 备份和同步数据保持可读，其中的历史分工字段会被安全忽略
          - 家庭成员继续用于宝宝记录人和家庭同步，不受本次下线影响
          - Android 包名为 com.dadkit.mobile，versionCode 为 26
          EOF
          gh release create "$GITHUB_REF_NAME" \
            DadKit-3.4.13.apk \
            DadKit-3.4.13.apk.sha256 \
            --verify-tag \
            --title "DadKit 3.4.13" \
            --notes-file release-notes.md
