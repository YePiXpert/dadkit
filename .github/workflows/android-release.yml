name: android-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/dadkit-release.keystore
      ANDROID_KEYSTORE_ALIAS: dadkit
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DADKIT_PUBLIC_ORIGIN: https://dadkit.505f.com
      NEXT_PUBLIC_DADKIT_API_BASE: https://dadkit.505f.com
      NEXT_PUBLIC_DADKIT_PUBLIC_WEB_ORIGIN: https://dadkit.505f.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag, main ancestry and absent Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v1.0.0"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and verify web application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run performance:check
          npm run android:validate -- "$GITHUB_REF_NAME"

      - name: Install Playwright browsers
        timeout-minutes: 26
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s 12m npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out."
            sleep 5
          done
          exit 1

      - name: Run Chromium and WebKit acceptance tests
        run: npm run test:e2e

      # APK 资源本地化：静态导出 + 同步 API 指向云端。注意发布顺序——
      # 云端服务器必须先于 APK 发布（旧数据迁移要靠服务器上的导出钩子）。
      - name: Build static web bundle for the APK
        run: |
          npm run build:static
          test -f out/index.html
          test -f out/sw.js
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r out android/app/src/main/assets/www
          test -f android/app/src/main/assets/www/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install fixed Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify local-assets APK alignment and signature
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          zipinfo -1 "$APK" > apk-entries.txt
          if ! grep -q '^assets/www/index.html$' apk-entries.txt; then
            echo "Local-assets APK must bundle the static web app." >&2
            exit 1
          fi
          if ! grep -q '^assets/www/sw.js$' apk-entries.txt; then
            echo "Local-assets APK must bundle the service worker." >&2
            exit 1
          fi
          cp "$APK" DadKit-1.0.0.apk
          sha256sum DadKit-1.0.0.apk > DadKit-1.0.0.apk.sha256
          cp "$AAB" DadKit-1.0.0.aab

      - name: Store AAB privately for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: DadKit-1.0.0-aab
          path: DadKit-1.0.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          DadKit 1.0.0

          - 资源本地化架构：Android 页面全部内置在安装包内，离线即可启动
          - 新增 iOS App（未签名 IPA 由构建产物提供，自签后安装）
          - 家庭同步数据继续存放在云端服务器，仅同步请求走网络
          - Web 支持静态导出部署，同步 API 可独立跨域调用
          - 旧版 Android 本地数据会在升级后首次启动时自动迁移
          - Android 包名为 com.dadkit.mobile，versionCode 为 28
          EOF
          gh release create "$GITHUB_REF_NAME" \
            DadKit-1.0.0.apk \
            DadKit-1.0.0.apk.sha256 \
            --verify-tag \
            --title "DadKit 1.0.0" \
            --notes-file release-notes.md
