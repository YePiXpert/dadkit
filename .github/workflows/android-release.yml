name: android-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/dadkit-release.keystore
      ANDROID_KEY_ALIAS: dadkit
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DADKIT_PUBLIC_ORIGIN: https://dadkit.505f.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, main ancestry and absent Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.4.3"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify web application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run performance:check
          npm run android:bundle
          npm run android:validate -- "$GITHUB_REF_NAME"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit acceptance tests
        run: npm run test:e2e

      - name: Run Docker integration tests
        run: npm run test:docker

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install fixed Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify bundled APK alignment and signature
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          zipinfo -1 "$APK" > apk-entries.txt
          test "$(awk '/^assets\/www\/item-art\/.*\.webp$/ { count++ } END { print count+0 }' apk-entries.txt)" = "144"
          test "$(awk '/^assets\/www\/growth\/.*\.webp$/ { count++ } END { print count+0 }' apk-entries.txt)" = "33"
          grep -q '^assets/www/index.html$' apk-entries.txt
          grep -q '^assets/www/tools/index.html$' apk-entries.txt
          if grep -q '^assets/default_checklist.json$' apk-entries.txt; then
            echo "Retired native checklist asset must not be packaged." >&2
            exit 1
          fi
          cp "$APK" DadKit-3.4.3.apk
          sha256sum DadKit-3.4.3.apk > DadKit-3.4.3.apk.sha256
          cp "$AAB" DadKit-3.4.3.aab

      - name: Store AAB privately for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: DadKit-3.4.3-aab
          path: DadKit-3.4.3.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          DadKit 3.4.3

          - Android 恢复与 PWA 完全相同的界面、体验和功能内容
          - APK 内置全部页面、144 张物品图、33 张成长图、字体与离线资源
          - 修复 3.4.2 原生版缺图、功能缺失和双端视觉不一致问题
          - 首次启动自动合并迁移 3.4.2 原生版数据与家庭同步会话
          - Android 包名为 com.dadkit.mobile，versionCode 为 16
          - iPhone PWA、Android APK 与 Web 均由同一套 Next.js 源码构建
          EOF
          gh release create "$GITHUB_REF_NAME" \
            DadKit-3.4.3.apk \
            DadKit-3.4.3.apk.sha256 \
            --verify-tag \
            --title "DadKit 3.4.3" \
            --notes-file release-notes.md
