name: android-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/dadkit-release.keystore
      ANDROID_KEY_ALIAS: dadkit
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DADKIT_PUBLIC_ORIGIN: https://dadkit.505f.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, main ancestry and absent Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.4.0"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify web application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run performance:check
          npm run android:bundle
          npm run android:validate -- "$GITHUB_REF_NAME"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit acceptance tests
        run: npm run test:e2e

      - name: Run Docker integration tests
        run: npm run test:docker

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install fixed Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify bundled APK alignment and signature
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DadKit-3.4.0.apk
          sha256sum DadKit-3.4.0.apk > DadKit-3.4.0.apk.sha256
          cp "$AAB" DadKit-3.4.0.aab

      - name: Store AAB privately for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: DadKit-3.4.0-aab
          path: DadKit-3.4.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          DadKit 3.4.0

          - 界面全面升级：无边框暖色卡片、柔和分层阴影、MiSans 字体，观感接近原生应用
          - 底部与桌面导航扩为五项，新增「工具」一级入口
          - 新增工具页：孕期成长记、准备出发、医院档案、家庭分工与采购一排直达
          - 首页重排为准备进度、宝宝、分工摘要与全部工具入口，层级更清晰
          - 开关、按钮、徽章、对话框与视图切换等基础组件样式统一精致化
          - Android 包名为 com.dadkit.mobile，versionCode 为 13
          - APK 内置完整界面、清单、成长图和物品图，断网可直接打开
          - 清单、成长记录和照片仍默认保存在应用本机沙箱；家庭同步与 WebDAV 为可选联网功能
          EOF
          gh release create "$GITHUB_REF_NAME" \
            DadKit-3.4.0.apk \
            DadKit-3.4.0.apk.sha256 \
            --verify-tag \
            --title "DadKit 3.4.0" \
            --notes-file release-notes.md
