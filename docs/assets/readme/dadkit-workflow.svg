<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">DadKit 使用流程</title>
  <desc id="desc">DadKit 从建立资料、生成清单、医院确认、临出门检查到导出备份的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7f8"/>
      <stop offset="1" stop-color="#f2fbf7"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#d34b75" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#ff5c7a"/>
    </marker>
    <style>
      .title { font: 800 48px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243231; }
      .subtitle { font: 500 22px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667470; }
      .step { font: 800 25px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243231; }
      .body { font: 600 17px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6c7774; }
      .badge { font: 900 22px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .note { font: 700 18px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ff5c7a; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="44" fill="url(#bg)"/>
  <circle cx="176" cy="146" r="58" fill="#ffe09b" opacity="0.75"/>
  <circle cx="1244" cy="120" r="94" fill="#ffd9e1" opacity="0.55"/>
  <circle cx="1162" cy="604" r="78" fill="#d8f2ea" opacity="0.8"/>

  <text x="96" y="104" class="title">DadKit 准备流程</text>
  <text x="96" y="144" class="subtitle">本地优先：用户资料只保存在当前浏览器，可导出 JSON 或手动备份到 WebDAV</text>

  <path d="M258 346H414" stroke="#ff5c7a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M588 346H744" stroke="#ff5c7a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M918 346h156" stroke="#ff5c7a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1169 446v62c0 42-34 76-76 76H320c-42 0-76-34-76-76v-41" fill="none" stroke="#ffc6d0" stroke-width="6" stroke-dasharray="14 14" stroke-linecap="round"/>

  <g transform="translate(96 236)" filter="url(#shadow)">
    <rect width="190" height="220" rx="34" fill="#fff"/>
    <circle cx="44" cy="46" r="24" fill="#ff5c7a"/>
    <text x="36" y="54" class="badge">1</text>
    <text x="34" y="106" class="step">建立资料</text>
    <text x="34" y="142" class="body">预产期</text>
    <text x="34" y="170" class="body">地区 / 医院</text>
    <text x="34" y="198" class="body">生产方式</text>
  </g>

  <g transform="translate(426 236)" filter="url(#shadow)">
    <rect width="190" height="220" rx="34" fill="#fff"/>
    <circle cx="44" cy="46" r="24" fill="#ff8a68"/>
    <text x="36" y="54" class="badge">2</text>
    <text x="34" y="106" class="step">今日优先</text>
    <text x="34" y="142" class="body">先做关键事</text>
    <text x="34" y="170" class="body">孕周节奏</text>
    <text x="34" y="198" class="body">进度摘要</text>
  </g>

  <g transform="translate(756 236)" filter="url(#shadow)">
    <rect width="190" height="220" rx="34" fill="#fff"/>
    <circle cx="44" cy="46" r="24" fill="#70d7b8"/>
    <text x="36" y="54" class="badge">3</text>
    <text x="34" y="106" class="step">清单 / 医院</text>
    <text x="34" y="142" class="body">待产包</text>
    <text x="34" y="170" class="body">医院确认</text>
    <text x="34" y="198" class="body">家人协作</text>
  </g>

  <g transform="translate(1086 236)" filter="url(#shadow)">
    <rect width="258" height="220" rx="34" fill="#fff"/>
    <circle cx="44" cy="46" r="24" fill="#ffe09b"/>
    <text x="36" y="54" class="badge">4</text>
    <text x="34" y="106" class="step">临出门检查</text>
    <text x="34" y="142" class="body">证件、手机、包、路线</text>
    <text x="34" y="170" class="body">医院电话和沟通卡</text>
    <text x="34" y="198" class="body">出发前统一确认</text>
  </g>

  <g transform="translate(436 540)" filter="url(#shadow)">
    <rect width="568" height="96" rx="32" fill="#fff"/>
    <circle cx="48" cy="48" r="24" fill="#ff5c7a"/>
    <path d="M38 49l8 8 18-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="42" class="step">导出与备份</text>
    <text x="92" y="70" class="body">复制协作文本、导出 JSON、本地快照、手动 WebDAV 备份</text>
  </g>

  <text x="978" y="588" class="note">资料变化后，可重新生成清单</text>
</svg>
