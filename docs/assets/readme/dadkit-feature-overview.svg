<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">DadKit 功能示例</title>
  <desc id="desc">三张手机界面示例，展示首页今日优先、待产清单和医院确认。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7f8"/>
      <stop offset="0.52" stop-color="#fff0f4"/>
      <stop offset="1" stop-color="#f6fff9"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffafa"/>
      <stop offset="1" stop-color="#fff1f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#d34b75" flood-opacity="0.2"/>
    </filter>
    <style>
      .title { font: 800 48px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243231; }
      .subtitle { font: 500 22px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6c7774; }
      .screen-title { font: 800 28px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243231; }
      .screen-sub { font: 600 16px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #687471; }
      .card-title { font: 800 19px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243231; }
      .card-text { font: 600 14px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6d7774; }
      .chip { font: 800 14px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ff5c7a; }
      .tab { font: 700 13px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #928986; }
      .tab-active { fill: #ff5c7a; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="176" cy="142" r="58" fill="#ffe09b" opacity="0.85"/>
  <circle cx="1272" cy="174" r="98" fill="#ff8da1" opacity="0.18"/>
  <circle cx="1230" cy="754" r="76" fill="#d8f2ea" opacity="0.85"/>
  <circle cx="206" cy="738" r="92" fill="#ffd9e1" opacity="0.45"/>

  <text x="120" y="116" class="title">DadKit 页面示例</text>
  <text x="120" y="154" class="subtitle">从今日优先、待产清单到医院确认，移动端优先的本地准备工具</text>

  <g transform="translate(132 214)" filter="url(#shadow)">
    <rect x="0" y="0" width="342" height="612" rx="54" fill="#1d2323"/>
    <rect x="16" y="18" width="310" height="576" rx="42" fill="url(#phone)"/>
    <rect x="118" y="34" width="106" height="24" rx="12" fill="#1d2323"/>
    <text x="42" y="96" class="screen-title">今日优先</text>
    <text x="42" y="124" class="screen-sub">先做最关键的几件事</text>
    <rect x="42" y="152" width="258" height="122" rx="28" fill="#ff5c7a"/>
    <text x="68" y="198" style="font: 800 31px sans-serif; fill: #fff;">待产准备 76%</text>
    <text x="68" y="230" style="font: 600 17px sans-serif; fill: #fff7f8;">距预产期还有 58 天</text>
    <rect x="42" y="300" width="258" height="70" rx="22" fill="#fff"/>
    <circle cx="76" cy="335" r="17" fill="#70d7b8"/>
    <path d="M68 335l7 7 13-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="329" class="card-title">确认入院材料</text>
    <text x="108" y="351" class="card-text">证件、医保与联系人</text>
    <rect x="42" y="386" width="258" height="70" rx="22" fill="#fff"/>
    <circle cx="76" cy="421" r="17" fill="#ffe09b"/>
    <text x="70" y="427" style="font: 800 18px sans-serif; fill:#ff8a68;">!</text>
    <text x="108" y="415" class="card-title">补齐妈妈包</text>
    <text x="108" y="437" class="card-text">只看未完成高优先级</text>
    <rect x="42" y="492" width="258" height="58" rx="29" fill="#fff"/>
    <circle cx="78" cy="521" r="20" fill="#ff5c7a"/>
    <text x="68" y="529" style="font: 800 20px sans-serif; fill:#fff;">⌂</text>
    <text x="129" y="526" class="tab">清单</text>
    <text x="190" y="526" class="tab">医院</text>
    <text x="250" y="526" class="tab">我的</text>
  </g>

  <g transform="translate(548 176)" filter="url(#shadow)">
    <rect x="0" y="0" width="342" height="690" rx="54" fill="#1d2323"/>
    <rect x="16" y="18" width="310" height="654" rx="42" fill="#fff7f8"/>
    <rect x="118" y="34" width="106" height="24" rx="12" fill="#1d2323"/>
    <text x="42" y="96" class="screen-title">待产清单</text>
    <text x="42" y="124" class="screen-sub">按包、阶段和状态整理</text>
    <rect x="42" y="154" width="258" height="72" rx="22" fill="#fff"/>
    <text x="66" y="187" class="card-title">妈妈包</text>
    <rect x="190" y="176" width="82" height="28" rx="14" fill="#ffeef2"/>
    <text x="208" y="195" class="chip">12 项</text>
    <rect x="42" y="244" width="258" height="72" rx="22" fill="#fff"/>
    <text x="66" y="277" class="card-title">宝宝包</text>
    <rect x="190" y="266" width="82" height="28" rx="14" fill="#e9f8f1"/>
    <text x="208" y="285" style="font:800 14px sans-serif; fill:#37a985;">8 项</text>
    <g transform="translate(42 344)">
      <rect width="258" height="64" rx="20" fill="#fff"/>
      <circle cx="32" cy="32" r="16" fill="#ff5c7a"/>
      <text x="64" y="28" class="card-title">证件资料</text>
      <text x="64" y="48" class="card-text">身份证、医保卡、产检资料</text>
    </g>
    <g transform="translate(42 424)">
      <rect width="258" height="64" rx="20" fill="#fff"/>
      <circle cx="32" cy="32" r="16" fill="#70d7b8"/>
      <path d="M24 32l7 7 14-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="28" class="card-title">已打包</text>
      <text x="64" y="48" class="card-text">随时可导出协作清单</text>
    </g>
    <rect x="42" y="588" width="258" height="58" rx="29" fill="#fff"/>
    <text x="68" y="622" class="tab">首页</text>
    <text x="129" y="622" class="tab tab-active">清单</text>
    <text x="190" y="622" class="tab">医院</text>
    <text x="250" y="622" class="tab">我的</text>
  </g>

  <g transform="translate(966 214)" filter="url(#shadow)">
    <rect x="0" y="0" width="342" height="612" rx="54" fill="#1d2323"/>
    <rect x="16" y="18" width="310" height="576" rx="42" fill="#fffafa"/>
    <rect x="118" y="34" width="106" height="24" rx="12" fill="#1d2323"/>
    <text x="42" y="96" class="screen-title">医院确认</text>
    <text x="42" y="124" class="screen-sub">把下次产检要问的事记下来</text>
    <rect x="42" y="154" width="258" height="92" rx="24" fill="#fff0f4"/>
    <text x="66" y="190" class="card-title">入院流程</text>
    <text x="66" y="217" class="card-text">待确认 3 项 · 已确认 5 项</text>
    <g transform="translate(42 278)">
      <rect width="258" height="66" rx="20" fill="#fff"/>
      <circle cx="32" cy="33" r="16" fill="#ffe09b"/>
      <text x="64" y="29" class="card-title">夜间入口在哪里？</text>
      <text x="64" y="50" class="card-text">问医院或产检窗口</text>
    </g>
    <g transform="translate(42 360)">
      <rect width="258" height="66" rx="20" fill="#fff"/>
      <circle cx="32" cy="33" r="16" fill="#ff8a68"/>
      <text x="64" y="29" class="card-title">陪产要求</text>
      <text x="64" y="50" class="card-text">证件、探视、核酸等</text>
    </g>
    <g transform="translate(42 442)">
      <rect width="258" height="66" rx="20" fill="#fff"/>
      <circle cx="32" cy="33" r="16" fill="#70d7b8"/>
      <path d="M24 33l7 7 14-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="29" class="card-title">医院提供物品</text>
      <text x="64" y="50" class="card-text">自动影响待产清单</text>
    </g>
    <rect x="42" y="492" width="258" height="58" rx="29" fill="#fff"/>
    <text x="68" y="526" class="tab">首页</text>
    <text x="129" y="526" class="tab">清单</text>
    <text x="190" y="526" class="tab tab-active">医院</text>
    <text x="250" y="526" class="tab">我的</text>
  </g>
</svg>
